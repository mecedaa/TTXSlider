<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Exercise instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C1E28; --ink2:#3E5761; --ink3:#6E858D;
    --field:#F3F6F5; --card:#FFFFFF; --rule:#CFDAD7;
    --mark:#0F6F72; --ghost:#9CACA9; --live:#A8760E;
    --r1:#A9C4C6; --r2:#3E8E91; --r3:#0B4A4D;
    --serif:"Newsreader", Georgia, "Times New Roman", serif;
    --sans:"Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--field);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:38rem;margin:0 auto;padding:0 1.1rem 4rem}
  .wrap.wide{max-width:64rem}

  .band{background:var(--ink);color:#EAF0EE;padding:.7rem 1.1rem;position:sticky;top:0;z-index:5}
  .band .inner{max-width:38rem;margin:0 auto;display:flex;align-items:baseline;
               justify-content:space-between;gap:1rem}
  .band.wideband .inner{max-width:64rem}
  .band .phase{font-size:.82rem;color:#9FB6B4}
  .band .roundname{font-family:var(--serif);font-size:1.05rem;font-weight:500}
  .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.4rem;
       vertical-align:middle;background:var(--ink3)}
  .dot.live{background:var(--live);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot.live{animation:none}}

  h1{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.25;margin:1.6rem 0 .3rem}
  .sub{color:var(--ink2);font-size:.9rem;line-height:1.5;margin:0 0 1.4rem;max-width:33rem}

  .q{background:var(--card);border:1px solid var(--rule);border-radius:2px;
     padding:1.1rem 1.1rem 1.3rem;margin-bottom:1rem}
  .q h2{font-family:var(--serif);font-weight:400;font-size:1.16rem;line-height:1.35;
        margin:0 0 1.1rem;max-width:30rem}
  .readout{display:flex;align-items:flex-end;justify-content:space-between;
           margin-bottom:.35rem;min-height:1.4rem}
  .value{font-family:var(--serif);font-size:2.5rem;line-height:1;font-weight:400;
         font-variant-numeric:tabular-nums;color:var(--mark)}
  .value.unset{color:var(--ink3)}
  .delta{font-size:.85rem;color:var(--ink2);text-align:right;line-height:1.35}
  .delta b{font-weight:600;color:var(--mark)}

  .track{position:relative;padding-top:.5rem}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;
                    margin:0;height:2.2rem;display:block}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule)}
  input[type=range]::-moz-range-track{height:3px;background:var(--rule)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
      width:22px;height:22px;border-radius:50%;background:var(--mark);border:3px solid #fff;
      box-shadow:0 0 0 1px var(--mark);margin-top:-10px;cursor:grab}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
      background:var(--mark);border:3px solid #fff;box-shadow:0 0 0 1px var(--mark);cursor:grab}
  input[type=range].unset::-webkit-slider-thumb{background:var(--ink3);box-shadow:0 0 0 1px var(--ink3)}
  input[type=range].unset::-moz-range-thumb{background:var(--ink3);box-shadow:0 0 0 1px var(--ink3)}
  input[type=range]:disabled::-webkit-slider-thumb{background:var(--ink3);box-shadow:0 0 0 1px var(--ink3);cursor:default}
  input[type=range]:disabled::-moz-range-thumb{background:var(--ink3);box-shadow:0 0 0 1px var(--ink3);cursor:default}
  .ghost{position:absolute;top:.5rem;height:2.2rem;width:1px;background:var(--ghost);pointer-events:none}
  .ghost span{position:absolute;top:-.05rem;left:.3rem;font-size:.7rem;color:var(--ghost);white-space:nowrap}
  .ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink2);margin-top:-.2rem}
  .ends span{max-width:45%}
  .ends span:last-child{text-align:right}

  .note{font-size:.82rem;color:var(--ink3);margin:.2rem 0 0}
  .foot{margin-top:1.6rem;font-size:.82rem;color:var(--ink3);line-height:1.6;
        border-top:1px solid var(--rule);padding-top:.9rem}
  button,.btn{font-family:var(--sans);font-size:.88rem;padding:.5rem .9rem;border-radius:2px;
         border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
         text-decoration:none;display:inline-block}
  button.ghostbtn,.btn.ghostbtn{background:transparent;color:var(--ink);border-color:var(--rule)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

  .panel{background:var(--card);border:1px solid var(--rule);padding:1.1rem;margin-bottom:1rem}
  .panel h3{font-family:var(--serif);font-weight:500;font-size:1.05rem;margin:0 0 .8rem}
  .roundpick{display:flex;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap}
  .roundpick button{border-color:var(--rule);background:#fff;color:var(--ink2)}
  .roundpick button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stat{display:flex;gap:2rem;flex-wrap:wrap;margin:.2rem 0 1rem}
  .stat div span{display:block;font-size:.78rem;color:var(--ink3)}
  .stat div b{font-family:var(--serif);font-size:1.5rem;font-weight:400}
  .chartq{font-family:var(--serif);font-size:1.1rem;margin:0 0 .2rem}
  .legend{display:flex;gap:1.2rem;font-size:.8rem;color:var(--ink2);margin:.2rem 0 1.2rem;flex-wrap:wrap}
  textarea,input[type=text],input[type=password]{width:100%;font-family:var(--sans);font-size:.85rem;
      padding:.5rem;border:1px solid var(--rule);border-radius:2px;background:#fff;color:var(--ink)}
  label.f{display:block;font-size:.8rem;color:var(--ink2);margin:.6rem 0 .2rem}
  .err{color:#8A2E2E;font-size:.85rem}
  .hide{display:none}
  .offline{background:#8A2E2E;color:#fff;font-size:.82rem;padding:.4rem 1.1rem;text-align:center}
</style>
</head>
<body>

<div id="offline" class="offline hide">Connection lost. Your last move may not be recorded. This will retry.</div>
<div id="band" class="band"><div class="inner">
  <div><span id="phaseLabel" class="phase"></span></div>
  <div id="roundName" class="roundname"></div>
</div></div>
<div id="app" class="wrap"></div>

<script>
/* ---------- scales: edit here if you change the questions ----------
   kind 'plain'  a straight 0 to 10 track; the stored value is the position
   kind 'money'  a logarithmic dollar track; the stored value is dollars.
                 The slider itself runs 0 to 100 and is converted, so the
                 low end gets as much room as the high end. With expMin 6
                 and expMax 10 the track reads $0, then $1m at the very
                 bottom, $100m halfway, $10bn at the top.
-------------------------------------------------------------------- */
var SCALES = [
  { kind:'plain', min:0, max:10,  step:0.1, showValue:false },                    // concern
  { kind:'money', min:0, max:100, step:0.5, showValue:true, expMin:6, expMax:10 },// economic impact
  { kind:'plain', min:0, max:10,  step:1,   showValue:true  }                     // understanding
];

/* ---------- server bridge ---------- */
function jget(url){
  return fetch(url, {cache:'no-store'}).then(function(r){
    if (!r.ok) throw new Error(r.status); return r.json();
  });
}
function jpost(url, body){
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)}).then(function(r){
    if (!r.ok) throw new Error(r.status); return r.json();
  });
}
function online(ok){ document.getElementById('offline').classList.toggle('hide', !!ok); }

/* ---------- state ---------- */
var session = null, pid = null, mine = {v:{}}, view = 'participant';
var facCode = null, all = [], pending = null, saving = false, dragging = false;

var $ = function(s){ return document.querySelector(s); };
var app = function(){ return $('#app'); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* value in, position on the track out, and back again */
function posToVal(pos, sc){
  if (sc.kind !== 'money') return pos;
  if (pos <= 0) return 0;
  var v = Math.pow(10, sc.expMin + (pos / sc.max) * (sc.expMax - sc.expMin));
  var mag = Math.pow(10, Math.floor(Math.log10(v)) - 2);   // three significant figures
  return Math.round(v / mag) * mag;
}
function valToPos(v, sc){
  if (sc.kind !== 'money') return v;
  if (!v || v <= 0) return 0;
  var p = sc.max * (Math.log10(v) - sc.expMin) / (sc.expMax - sc.expMin);
  return Math.max(0, Math.min(sc.max, p));
}
function pctOf(v, sc){
  if (sc.kind === 'money') return valToPos(v, sc) / sc.max * 100;
  return (v - sc.min) / (sc.max - sc.min) * 100;
}
function defaultVal(sc){
  return sc.kind === 'money' ? posToVal(sc.max / 2, sc) : sc.min + (sc.max - sc.min) / 2;
}
function money(v){
  if (!v || v <= 0) return '$0';
  if (v >= 1e9) { var b = v/1e9; return '$' + (b < 10 ? b.toFixed(1).replace(/\.0$/,'') : Math.round(b)) + 'bn'; }
  if (v >= 1e6) { var m = v/1e6; return '$' + (m < 10 ? m.toFixed(1).replace(/\.0$/,'') : Math.round(m)) + 'm'; }
  return '$' + Math.round(v).toLocaleString();
}
function fmt(v, sc){
  if (v === null || v === undefined || v === '') return '';
  if (sc.kind === 'money') return money(v);
  return sc.step >= 1 ? String(Math.round(v)) : (Math.round(v*10)/10).toFixed(1);
}
function moneyDelta(now, then){
  if (then === 0 && now === 0) return 'Still $0';
  if (then === 0) return 'Up from $0';
  if (now === 0) return 'Down to $0';
  var r = now / then;
  if (r > 1.08) return 'About ' + (r < 10 ? r.toFixed(1).replace(/\.0$/,'') : Math.round(r)) + ' times higher';
  if (r < 0.92) { var d = 1/r; return 'About ' + (d < 10 ? d.toFixed(1).replace(/\.0$/,'') : Math.round(d)) + ' times lower'; }
  return 'About the same';
}
function withScales(s){
  if (s && s.questions) s.questions.forEach(function(q,i){ q.scale = SCALES[i]; });
  return s;
}
function getPid(){
  var id = null;
  try { id = localStorage.getItem('ttx_pid'); } catch(e){}
  if (!id){
    id = Math.random().toString(36).slice(2,7) + Math.random().toString(36).slice(2,6);
    try { localStorage.setItem('ttx_pid', id); } catch(e){}
  }
  return id;
}

/* ---------- band ---------- */
function renderBand(){
  var band = $('#band');
  band.className = 'band' + (view === 'participant' ? '' : ' wideband');
  if (!session){
    $('#phaseLabel').innerHTML = '<span class="dot"></span>Connecting';
    $('#roundName').textContent = '';
    return;
  }
  var live = session.phase === 'open';
  $('#phaseLabel').innerHTML = '<span class="dot' + (live?' live':'') + '"></span>' +
    (live ? 'Recording' : 'Closed');
  $('#roundName').textContent = session.rounds[session.round-1] || ('Round ' + session.round);
}

/* ---------- participant ---------- */
function renderParticipant(){
  renderBand();
  if (!session){ app().innerHTML = '<h1>Connecting.</h1>'; return; }

  var r = session.round, open = session.phase === 'open';
  var cur = mine.v[r] || [null,null,null];
  var prev = mine.v[r-1] || null;

  var cards = session.questions.map(function(q,i){
    var sc = q.scale;
    var val = cur[i];
    var unset = (val === null || val === undefined || val === '');
    var shown = unset ? defaultVal(sc) : Number(val);
    var p = prev ? prev[i] : null;
    var hasPrev = (p !== null && p !== undefined && p !== '');

    var deltaHTML = '';
    if (hasPrev){
      if (unset){
        deltaHTML = sc.showValue ? 'Last round you marked <b>' + fmt(p,sc) + '</b>'
                                 : 'Your last-round position is marked on the line';
      } else if (sc.kind === 'money'){
        deltaHTML = 'Last round <b>' + fmt(p,sc) + '</b><br>' + moneyDelta(shown, p);
      } else if (sc.showValue){
        var d = shown - p;
        deltaHTML = 'Last round <b>' + fmt(p,sc) + '</b><br>' +
          (d === 0 ? 'No change' : 'Change ' + (d>0?'+':'&minus;') + fmt(Math.abs(d),sc));
      } else {
        var d2 = shown - p;
        deltaHTML = d2 === 0 ? 'No change from last round'
          : 'Moved toward <b>' + esc(d2 > 0 ? q.right : q.left) + '</b>';
      }
    }
    var gp = hasPrev ? pctOf(p, sc) : 0;
    var ghost = hasPrev
      ? '<div class="ghost" style="left:calc(11px + ' + gp + '% - ' + (gp*22/100) + 'px)">' +
        (sc.showValue ? '<span>' + fmt(p,sc) + '</span>' : '') + '</div>'
      : '';
    var valueEl = sc.showValue
      ? '<div class="value ' + (unset?'unset':'') + '" id="v' + i + '">' +
        (unset ? '&mdash;' : fmt(shown,sc)) + '</div>'
      : '<div></div>';

    return '<div class="q"><h2>' + esc(q.text) + '</h2>' +
      '<div class="readout">' + valueEl + '<div class="delta">' + deltaHTML + '</div></div>' +
      '<div class="track">' + ghost +
      '<input type="range" min="' + sc.min + '" max="' + sc.max + '" step="' + sc.step + '"' +
      ' value="' + valToPos(shown, sc) + '" id="s' + i + '" data-i="' + i + '"' +
      ' class="' + (unset?'unset':'') + '" aria-label="' + esc(q.text) + '"' +
      (open ? '' : ' disabled') + '></div>' +
      '<div class="ends"><span>' + esc(q.left) + '</span><span>' + esc(q.right) + '</span></div>' +
      (unset && open ? '<p class="note">Move the slider to record a position.</p>' : '') +
      '</div>';
  }).join('');

  app().className = 'wrap';
  app().innerHTML =
    '<h1>' + esc(session.title) + '</h1>' +
    '<p class="sub">' + (open
      ? 'Mark where you stand right now. You can adjust until the facilitator closes the round.'
      : 'This round is closed. Your positions have been recorded. Wait for the next round to open.') +
    '</p>' + cards +
    '<p class="note" id="saveState"></p>' +
    '<div class="foot">No names are collected. This device is identified only as <code>' +
      pid.slice(0,4) + '</code>.<br>' +
      '<button class="ghostbtn" id="toFac" style="margin-top:.6rem">Facilitator controls</button></div>';

  Array.prototype.forEach.call(app().querySelectorAll('input[type=range]'), function(el){
    el.addEventListener('input', onSlide);
    el.addEventListener('change', onSlide);
    el.addEventListener('pointerdown', function(){ dragging = true; });
    el.addEventListener('pointerup', function(){ dragging = false; });
  });
  $('#toFac').addEventListener('click', function(){ view = 'gate'; render(); });
}

function onSlide(e){
  if (!session || session.phase !== 'open') return;
  var i = +e.target.dataset.i;
  var q = session.questions[i], sc = q.scale;
  var pos = Math.max(sc.min, Math.min(sc.max, Math.round(+e.target.value / sc.step) * sc.step));
  var v = sc.kind === 'money' ? posToVal(pos, sc) : Math.round(pos * 10) / 10;
  var r = session.round;
  if (!mine.v[r]) mine.v[r] = [null,null,null];
  mine.v[r][i] = v;

  var out = $('#v'+i);
  if (out){ out.textContent = fmt(v, sc); out.classList.remove('unset'); }
  e.target.classList.remove('unset');

  var prev = mine.v[r-1];
  if (prev && prev[i] !== null && prev[i] !== undefined && prev[i] !== ''){
    var box = e.target.closest('.q').querySelector('.delta');
    if (sc.kind === 'money'){
      box.innerHTML = 'Last round <b>' + fmt(prev[i],sc) + '</b><br>' + moneyDelta(v, prev[i]);
    } else if (sc.showValue){
      var d = v - prev[i];
      box.innerHTML = 'Last round <b>' + fmt(prev[i],sc) + '</b><br>' +
        (d === 0 ? 'No change' : 'Change ' + (d>0?'+':'&minus;') + fmt(Math.abs(d),sc));
    } else {
      var d3 = v - prev[i];
      box.innerHTML = d3 === 0 ? 'No change from last round'
        : 'Moved toward <b>' + esc(d3 > 0 ? q.right : q.left) + '</b>';
    }
  }
  var hint = e.target.closest('.q').querySelector('.note');
  if (hint && hint.id !== 'saveState') hint.remove();

  clearTimeout(pending);
  pending = setTimeout(save, 500);
}

function save(){
  if (saving){ clearTimeout(pending); pending = setTimeout(save, 500); return; }
  var r = session.round;
  saving = true;
  jpost('/api/save', { pid: pid, round: r, vals: mine.v[r] || [null,null,null] })
    .then(function(res){
      saving = false; online(true);
      var el = $('#saveState');
      if (res && res.ok){
        if (el) el.textContent = 'Saved ' +
          new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      } else if (res && res.session){
        session = withScales(res.session);
        renderParticipant();
      }
    })
    .catch(function(){ saving = false; online(false); setTimeout(save, 3000); });
}

/* ---------- facilitator ---------- */
function renderGate(){
  renderBand();
  app().className = 'wrap';
  app().innerHTML =
    '<h1>Facilitator controls</h1>' +
    '<p class="sub">Enter the code to open the round controls and the results display.</p>' +
    '<div class="panel"><label class="f" for="code">Code</label>' +
    '<input type="password" id="code" autocomplete="off">' +
    '<p class="err hide" id="codeErr">That code is not right.</p>' +
    '<div class="row" style="margin-top:.8rem"><button id="go">Open controls</button>' +
    '<button class="ghostbtn" id="back">Back to my sliders</button></div></div>';
  $('#back').addEventListener('click', function(){ view='participant'; render(); });
  $('#go').addEventListener('click', tryCode);
  $('#code').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryCode(); });
}
function tryCode(){
  var c = $('#code').value.trim();
  jpost('/api/admin/check', { code: c }).then(function(){
    facCode = c;
    try { localStorage.setItem('ttx_fac', c); } catch(e){}
    view = 'facilitator';
    return loadAll();
  }).then(render).catch(function(){ $('#codeErr').classList.remove('hide'); });
}

function loadAll(){
  return jget('/api/admin/all?code=' + encodeURIComponent(facCode)).then(function(res){
    all = res.records || [];
    session = withScales(res.session);
    online(true);
  }).catch(function(){ online(false); });
}

function statsFor(round, qi, sc){
  var vals = all.map(function(r){ return (r.v[round]||[])[qi]; })
                .filter(function(v){ return v !== null && v !== undefined && v !== ''; })
                .map(Number).sort(function(a,b){ return a-b; });
  if (!vals.length) return { n:0, mid:null, vals:[] };
  var mid;
  if (sc.kind === 'money'){
    // a handful of very large estimates would drag an average across the whole
    // track, so the money question is summarised by its median
    var h = Math.floor(vals.length/2);
    mid = vals.length % 2 ? vals[h] : (vals[h-1] + vals[h]) / 2;
  } else {
    mid = vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
  }
  return { n: vals.length, mid: mid, vals: vals };
}

function stripChart(qi){
  var sc = session.questions[qi].scale, rowH = 46;
  var colors = ['var(--r1)','var(--r2)','var(--r3)'];
  var rows = '';
  for (var r=1; r<=3; r++){
    var st = statsFor(r, qi, sc), y = (r-1)*rowH + 26;
    var dots = st.vals.map(function(v,k){
      var j = ((k*37)%9 - 4) * 1.1;
      return '<circle cx="' + pctOf(v,sc) + '" cy="' + (y+j) + '" r="1.6" fill="' +
             colors[r-1] + '" fill-opacity=".85"></circle>';
    }).join('');
    var mark = '';
    if (st.mid !== null){
      var mx = pctOf(st.mid, sc);
      var label = sc.kind === 'money' ? fmt(st.mid, sc) : st.mid.toFixed(1);
      mark = '<line x1="'+mx+'" x2="'+mx+'" y1="'+(y-13)+'" y2="'+(y+13)+'" stroke="' +
             colors[r-1] + '" stroke-width="1.1"></line>' +
             '<text x="'+mx+'" y="'+(y-16)+'" font-size="6" text-anchor="middle" ' +
             'fill="var(--ink2)" font-family="Newsreader, serif">' + label + '</text>';
    }
    rows += '<line x1="0" x2="100" y1="'+y+'" y2="'+y+'" stroke="var(--rule)" stroke-width=".4"></line>' +
            '<text x="0" y="'+(y-16)+'" font-size="5.2" fill="var(--ink3)">Round '+r+', n='+st.n+'</text>' +
            dots + mark;
  }
  return '<svg viewBox="0 0 100 ' + (rowH*3) + '" style="width:100%;height:' + (rowH*3*1.9) +
         'px;overflow:visible" role="img" aria-label="Distribution of responses by round">' +
         rows + '</svg>';
}

function renderFacilitator(){
  renderBand();
  var s = session;
  if (!s){ app().innerHTML = '<h1>Connecting.</h1>'; return; }
  var open = s.phase === 'open';
  var answered = all.filter(function(r){
    return (r.v[s.round]||[]).some(function(v){ return v !== null && v !== undefined && v !== ''; });
  }).length;

  var charts = s.questions.map(function(q,i){
    var sc = q.scale;
    var marker = sc.kind === 'money'
      ? 'Vertical mark is the median. The track is logarithmic.'
      : 'Vertical mark is the mean';
    return '<div class="panel"><p class="chartq">' + esc(q.text) + '</p>' +
      '<div class="legend"><span>Left of line: ' + esc(q.left) + '</span>' +
      '<span>Right of line: ' + esc(q.right) + '</span>' +
      '<span>' + marker + '</span></div>' + stripChart(i) + '</div>';
  }).join('');

  app().className = 'wrap wide';
  app().innerHTML =
    '<h1>' + esc(s.title) + '</h1>' +
    '<div class="panel"><h3>Round control</h3><div class="roundpick">' +
      s.rounds.map(function(rn,k){
        return '<button data-r="'+(k+1)+'" aria-pressed="'+(s.round===k+1)+'">'+esc(rn)+'</button>';
      }).join('') + '</div>' +
      '<div class="row"><button id="toggle">' +
        (open ? 'Close round and save positions' : 'Open this round') + '</button></div>' +
      '<div class="stat" style="margin-top:1rem">' +
        '<div><span>Participants</span><b>' + all.length + '</b></div>' +
        '<div><span>Recorded this round</span><b>' + answered + '</b></div>' +
        '<div><span>Status</span><b style="font-size:1.1rem">' + (open?'Open':'Closed') + '</b></div>' +
      '</div><p class="note">The charts below update as people move. Closing the round locks ' +
      'every slider within a second or so, and the last position each person set is what stays ' +
      'recorded. You can reopen a round if you need to.</p></div>' +
    charts +
    '<div class="panel"><h3>Data</h3>' +
      '<div class="row"><a class="btn ghostbtn" id="dl" href="/api/admin/export.csv?code=' +
      encodeURIComponent(facCode) + '">Download CSV</a>' +
      '<button class="ghostbtn" id="csv">Show CSV here</button></div>' +
      '<textarea id="csvOut" rows="8" class="hide" style="margin-top:.7rem"></textarea></div>' +
    settingsHTML(s) +
    '<div class="panel"><h3>Reset</h3><p class="note" style="margin-bottom:.7rem">' +
      'Clears every participant entry for all three rounds. Download the CSV first.</p>' +
      '<button class="ghostbtn" id="reset">Clear all responses</button>' +
      '<span id="resetConfirm" class="hide row" style="margin-top:.6rem">' +
      '<button id="resetYes">Yes, clear everything</button>' +
      '<button class="ghostbtn" id="resetNo">Cancel</button></span></div>' +
    '<div class="foot"><button class="ghostbtn" id="back">Back to my sliders</button></div>';

  Array.prototype.forEach.call(app().querySelectorAll('.roundpick button'), function(b){
    b.addEventListener('click', function(){
      jpost('/api/admin/round', {code:facCode, round:+b.dataset.r, phase:'closed'})
        .then(function(res){ session = withScales(res); return loadAll(); }).then(render);
    });
  });
  $('#toggle').addEventListener('click', function(){
    jpost('/api/admin/round', {code:facCode, round:s.round, phase: open ? 'closed' : 'open'})
      .then(function(res){ session = withScales(res); return loadAll(); }).then(render);
  });
  $('#csv').addEventListener('click', function(){
    var t = $('#csvOut'); t.classList.remove('hide'); t.value = buildCSV(); t.select();
  });
  $('#reset').addEventListener('click', function(){ $('#resetConfirm').classList.remove('hide'); });
  $('#resetNo').addEventListener('click', function(){ $('#resetConfirm').classList.add('hide'); });
  $('#resetYes').addEventListener('click', function(){
    jpost('/api/admin/clear', {code:facCode}).then(function(res){
      session = withScales(res); mine = {v:{}}; return loadAll();
    }).then(render);
  });
  $('#back').addEventListener('click', function(){ view='participant'; render(); });
  bindSettings();
}

function buildCSV(){
  var out = 'participant,round,q1,q2,q3\n';
  all.forEach(function(r){
    for (var k=1;k<=3;k++){
      var v = r.v[k];
      if (!v) continue;
      out += [r.pid, k, v[0]===null?'':v[0], v[1]===null?'':v[1], v[2]===null?'':v[2]].join(',') + '\n';
    }
  });
  return out;
}

function settingsHTML(s){
  return '<div class="panel"><h3>Wording</h3>' +
    '<label class="f" for="t">Exercise title</label><input type="text" id="t" value="' + esc(s.title) + '">' +
    s.rounds.map(function(rn,i){
      return '<label class="f" for="rn'+i+'">Round '+(i+1)+' label</label>' +
             '<input type="text" id="rn'+i+'" value="'+esc(rn)+'">';
    }).join('') +
    s.questions.map(function(q,i){
      return '<label class="f" for="qt'+i+'">Question '+(i+1)+'</label>' +
        '<input type="text" id="qt'+i+'" value="'+esc(q.text)+'">' +
        '<div class="row" style="margin-top:.3rem">' +
        '<input type="text" id="ql'+i+'" value="'+esc(q.left)+'" style="flex:1" aria-label="Left end label">' +
        '<input type="text" id="qr'+i+'" value="'+esc(q.right)+'" style="flex:1" aria-label="Right end label">' +
        '</div>';
    }).join('') +
    '<div class="row" style="margin-top:.9rem"><button id="saveSettings">Save wording</button></div></div>';
}
function bindSettings(){
  var b = $('#saveSettings');
  if (!b) return;
  b.addEventListener('click', function(){
    var cfg = {
      title: $('#t').value,
      rounds: [0,1,2].map(function(i){ return $('#rn'+i).value; }),
      questions: [0,1,2].map(function(i){
        return { text:$('#qt'+i).value, left:$('#ql'+i).value, right:$('#qr'+i).value };
      })
    };
    jpost('/api/admin/config', {code:facCode, cfg:cfg}).then(function(res){
      session = withScales(res); render();
    }).catch(function(){ online(false); });
  });
}

/* ---------- live connection ---------- */
function connect(){
  var es;
  try { es = new EventSource('/api/events'); } catch(e){ return; }
  es.onopen = function(){ online(true); };
  es.onerror = function(){ online(false); };   // EventSource reconnects on its own
  es.onmessage = function(ev){
    var msg;
    try { msg = JSON.parse(ev.data); } catch(e){ return; }
    online(true);
    if (msg.type === 'session'){
      var before = session ? session.round + session.phase : '';
      session = withScales(msg.session);
      var after = session.round + session.phase;
      if (view === 'participant'){
        if (before !== after){
          jget('/api/mine?pid=' + encodeURIComponent(pid)).then(function(m){
            mine = { v: m.v || {} };
            renderParticipant();
          });
        } else renderBand();
      } else if (view === 'facilitator'){
        loadAll().then(render);
      }
    }
    if (msg.type === 'data' && view === 'facilitator'){
      loadAll().then(render);
    }
  };
}

/* ---------- boot ---------- */
function render(){
  if (view === 'participant') renderParticipant();
  else if (view === 'gate') renderGate();
  else renderFacilitator();
}

(function init(){
  pid = getPid();
  try { facCode = localStorage.getItem('ttx_fac'); } catch(e){}
  jget('/api/state').then(function(s){
    session = withScales(s);
    return jget('/api/mine?pid=' + encodeURIComponent(pid));
  }).then(function(m){
    mine = { v: m.v || {} };
    online(true);
    render();
    connect();
    // slow safety net in case the live connection is blocked by a network
    setInterval(function(){
      if (view !== 'participant' || dragging) return;
      jget('/api/state').then(function(s){
        var before = session ? session.round + session.phase : '';
        session = withScales(s);
        if (before !== session.round + session.phase){
          return jget('/api/mine?pid=' + encodeURIComponent(pid)).then(function(m2){
            mine = { v: m2.v || {} };
            renderParticipant();
          });
        }
      }).catch(function(){});
    }, 15000);
  }).catch(function(){
    online(false);
    app().innerHTML = '<h1>Could not reach the server.</h1>' +
      '<p class="sub">Reload the page. If it keeps failing, tell the facilitator.</p>';
  });
})();
</script>
</body>
</html>
